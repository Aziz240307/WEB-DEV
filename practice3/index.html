<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Profile Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="profile-header">
        <div class="profile-left">
            <div class="profile-pic">
                <div class="big-icon">
    <svg aria-label="Instagram" fill="none" height="48" viewBox="0 0 24 24" width="48">
        <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Z" stroke="white" stroke-width="1.5"/>
        <path d="M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" stroke="white" stroke-width="1.5"/>
        <circle cx="17.5" cy="6.5" r="1" fill="white"/>
    </svg>
</div>
            </div>
        </div>

        <div class="profile-right">
            <div class="top-row">
                <h2>azeke.24</h2>
                <button class="btn">Редактировать профиль</button>
                <button class="btn">Посмотреть архив</button>
            </div>

            <div class="stats">
                <span><b>0</b> публикаций</span>
                <span><b>292</b> подписчиков</span>
                <span><b>381</b> подписок</span>
            </div>

            <div class="bio">
                <strong>Azizbek</strong><br>
                NPhMS-2024<br>
                KBTU-2028
            </div>
        </div>
    </div>

    <!-- Highlights -->
    <div class="highlights">
        <div class="highlight">
            <div class="circle"></div>
            <p>NSPhM</p>
        </div>

        <div class="highlight">
            <div class="circle add">+</div>
            <p>Добавить</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active">☷</div>
        <div class="tab">🔖</div>
        <div class="tab">👤</div>
    </div>

    <!-- Empty posts section -->
    <div class="empty-posts">
        <div class="big-icon">
    <svg aria-label="Instagram" fill="none" height="48" viewBox="0 0 24 24" width="48">
        <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Z" stroke="white" stroke-width="1.5"/>
        <path d="M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" stroke="white" stroke-width="1.5"/>
        <circle cx="17.5" cy="6.5" r="1" fill="white"/>
    </svg>
</div>
        <h2>Поделиться фото</h2>
        <p>Фото, которыми вы делитесь, будут показываться в вашем профиле.</p>
        <a href="#">Поделитесь своим первым фото</a>
    </div>

</div>

</body>
</html>
